sonar.projectKey=nodeapp
sonar.host.url=http://192.168.50.4:9000
sonar.projectName=Lavoro
sonar.projectVersion=1.0

# Les identifiants sont gérés par Jenkins

# Sources - Include both backend and frontend source code
sonar.sources=LavoroBack/controllers,LavoroBack/models,LavoroBack/routes,LavoroBack/middleware,LavoroBack/services,LavoroBack/utils,LavoroFront/src

# Test sources (only include existing test files)
# sonar.tests=LavoroBack/test,LavoroFront/src/**/*.test.js,LavoroFront/src/**/*.spec.js
# Commented out because LavoroBack/test directory doesn't exist

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Language-specific settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions - Exclude more files
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.js,**/*.spec.js,**/public/**,**/*.min.js,**/vendor/**,**/assets/**,**/*.json,**/*.html,**/*.css,**/*.map,**/coverage/**,**/ML/**,**/ml_model/**,**/ML_Prioritazing/**

# Coverage exclusions
sonar.coverage.exclusions=**/test/**,**/*.test.js,**/*.spec.js,**/public/**,**/assets/**

# Debug mode
sonar.verbose=true
